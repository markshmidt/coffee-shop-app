name: CI (Django + Docker)

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    defaults:
      run:
        working-directory: coffeeshop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        working-directory: coffeeshop     
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Django checks
        working-directory: coffeeshop    
        env:
          DJANGO_SETTINGS_MODULE: coffeeshop.settings
        run: |
          python manage.py check --fail-level WARNING
          python manage.py makemigrations --check --dry-run

      - name: Lint
        working-directory: coffeeshop
        run: ruff check .
   
      - name: Migrate (SQLite)
        working-directory: coffeeshop
        run: python manage.py migrate --noinput

      # Only run pytest if tests are present (for future)
      - name: Run tests (only if present)
         working-directory: coffeeshop
        run: |
          if ls -1 **/tests.py tests 2>/dev/null | grep -q .; then
            pytest -q --maxfail=1
          else
            echo "No tests found — skipping pytest"
          fi
