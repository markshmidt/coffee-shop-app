name: CI (Django)
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show layout
        run: |
          pwd
          ls -la
          ls -la coffeeshop

      - name: Install deps
        working-directory: ./coffeeshop
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install django; fi

      - name: Prepare logs dir (belt & suspenders)
        working-directory: ./coffeeshop
        run: |
          mkdir -p data
          mkdir -p coffeeshop/logs
        

      - name: Django checks
        working-directory: ./coffeeshop
        env:
          DJANGO_SETTINGS_MODULE: coffeeshop.settings
        run: python manage.py check --fail-level WARNING
        
      - name: Install Ruff
        run: pip install ruff
        
      - name: Lint
        working-directory: ./coffeeshop
        run: ruff check .
   
      - name: Migrate (SQLite)
        working-directory: ${{ github.workspace }}/data/db.sqlite3
        run: python manage.py migrate --noinput
  docker:
    needs: test-and-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref_type == 'tag' || github.ref_name == 'main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Simple smoke test
      - name: Run container for smoke test
        run: |
          docker run -d --name app -p 8000:8000 \
            -e DJANGO_DB_PATH=/data/db.sqlite3 \
            -e SECRET_KEY=ci-secret \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e CSRF_TRUSTED_ORIGINS=http://localhost:8000 \
            -v ${{ github.workspace }}/data:/data \
            ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

          # wait a few seconds for migrate
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ >/dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start" >&2
          docker logs app || true
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f app || true
