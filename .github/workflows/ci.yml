name: CI (Django)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show layout
        run: |
          pwd
          ls -la
          ls -la coffeeshop

      - name: Install deps
        working-directory: ./coffeeshop
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install django; fi

      - name: Prepare logs dir (belt & suspenders)
        working-directory: ./coffeeshop
        run: mkdir -p logs

      - name: Django checks
        working-directory: ./coffeeshop
        env:
          DJANGO_SETTINGS_MODULE: coffeeshop.settings
        run: python manage.py check --fail-level WARNING
        
      - name: Install Ruff
        run: pip install ruff
        
      - name: Lint
        working-directory: ./coffeeshop
        run: ruff check .
   
      - name: Migrate (SQLite)
        working-directory: ./coffeeshop
        run: python manage.py migrate --noinput

     
