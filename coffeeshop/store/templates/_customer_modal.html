<div id="customer-modal" class="modal hidden">
  <div class="modal__dialog panel" style="max-width:640px">
    <div class="modal__header">
      <h3>Assign customer</h3>
      <button class="x close-modal" id="cust-close" aria-label="Close">X</button>
    </div>

    <div class="modal__body">
      <div class="grid" style="display:grid; grid-template-columns: 1fr 260px; gap:16px;">

        <!-- Search & results -->
        <div>
          <input id="cust-search" class="input" placeholder="Search name, phone, or email…" />
          <div id="cust-results" style="margin-top:10px; max-height:40vh; overflow:auto;"></div>
        </div>

        <!-- Create new -->
        <form id="cust-create" class="panel" style="padding:12px;">
          <h4 class="section-title">New customer</h4>
          <div style="display:grid; gap:8px;">
            <input class="input" name="fname" placeholder="First name" />
            <input class="input" name="lname" placeholder="Last name" />
            <input class="input" name="phone" placeholder="Phone (e.g., +14165551234)" required />
            <input class="input" name="email" placeholder="Email (optional)" />
          </div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button type="submit" class="btn primary">Create & assign</button>
            <button id="cust-remove" type="button" class="btn warn">Remove</button>
          </div>
          <p id="cust-create-msg" style="margin-top:8px; font-size:.9rem;"></p>
        </form>
      </div>
    </div>
  </div>
</div>
