{% extends "pos-base.html" %}
{% load static %}

{% block title %}Customer Management{% endblock %}

{% block content %}
<div class="customers-page" data-page="customers">

    <h2 class="page-title">Customer Management</h2>

    <p class="page-subtitle">
        Search, view details, edit, delete, and analyze customer activity.
    </p>

    <div class="customers-bar">
        <button id="btn-add-customer" class="btn primary">+ Add New Customer</button>
        <input id="cust-search"
               type="text"
               class="search-input"
               placeholder="Search by name, phone, or email...">
    </div>

    <div id="customers-feed" class="customers-feed"></div>

    <div class="customers-more">
        <button id="btn-load-more" class="btn">Load More</button>
    </div>

</div>

{% include "customer_modal.html" %}
{% endblock %}
