{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Roboto Medium -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <title>Login</title>
</head>

<body>

<!-- Top stripe -->
<div class="stripe-top"></div>

<div class="page-wrapper">

    <!-- LEFT SIDE -->
    <div class="left-side">

        <h1 class="brand">
            COFFEE
            <img src="{% static 'pics/flower.png' %}" class="flower-icon">
            ISLAND
        </h1>

        <p class="mission-text">
            Our mission is to ensure that the products we obtain express<br>
            the loving effort and care which ensures our excellence.
        </p>

        <img src="{% static 'pics/toronto-coffee-island.jpg' %}" class="coffee-photo">
    </div>

    <!-- RIGHT SIDE LOGIN -->
    <div class="right-side">
        <div class="login-container">

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <label>Username</label>
                <input type="text" name="username">

                <label>Password</label>
                <input type="password" name="password">

                <button type="submit" class="btn-submit">Sign IN</button>

                {% if messages %}
                    {% for message in messages %}
                    <div class="msg-error">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            </form>

        </div>
    </div>

</div>

<!-- Bottom stripe -->
<div class="stripe-bottom"></div>

</body>
</html>
